lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml
    - .github/workflows/linting_comment.yml
  files_unchanged:
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/nf-core-genomeassembler_logo_light.png
    - assets/nf-core-genomeassembler_logo_light.png
    - docs/images/nf-core-genomeassembler_logo_light.png
    - docs/images/nf-core-genomeassembler_logo_dark.png
    - .prettierignore
    - .gitignore
    - nf-core-genomeassembler_logo_dark.svg
  # These focused tests run no tools: preparation passes through an assembly,
  # and initialization deliberately fails before any versions.yml can be emitted.
  nf_test_content:
    - tests/supplied_assembly.nf.test
    - tests/supplied_assembly_initialization.nf.test
    - tests/qc_reads.nf.test
  multiqc_config: false
nf_core_version: 4.1.0
repository_type: pipeline
template:
  author: Niklas Schandry
  description: Assemble genomes from long ONT or pacbio HiFi reads
  force: false
  is_nfcore: true
  name: genomeassembler
  org: nf-core
  outdir: .
  skip_features:
    - multiqc
    - igenomes
  version: 2.0.1-dev
